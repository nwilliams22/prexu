name: Release

on:
  # Build inspectable Linux candidates without creating a tag or release.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - src-tauri/tauri.linux.conf.json
      - scripts/patches/mpv-scaler-lut-padding.patch
    tags:
      - "v*"

permissions:
  contents: write

# Windows libmpv dev archive URL. Self-hosted mirror under this repo's
# `libmpv-vendor` release —
# upstream zhongfly/mpv-winbuild rotates and deletes nightlies within days,
# 404ing any pinned upstream URL (prexu-n1wt). The mirror is the **baseline**
# (non-v3) build — the AVX2 v3 build fails LoadLibrary with ERROR_NOACCESS on
# Windows 11 (see docs/native-player-status.md). Same pinned asset + SHA256 as
# ci.yml; keep the two workflows in lockstep when bumping. Override per-run via
# the `LIBMPV_URL`/`LIBMPV_SHA256` repository variables. The SHA256 is verified
# after download and a mismatch fails the build; cache invalidates
# automatically when the URL or SHA256 changes.
env:
  LIBMPV_URL: ${{ vars.LIBMPV_URL || 'https://github.com/nwilliams22/prexu/releases/download/libmpv-vendor/mpv-dev-x86_64-20260629-git-3f1b23abd0.7z' }}
  LIBMPV_SHA256: ${{ vars.LIBMPV_SHA256 || 'ea0a4aa3bdb1fc225c5fa4f73f7a705e06fae84f99fc8f9946757e99eb5f5a26' }}
  # Recover the pinned ANGLE pair from the mirrored v0.7.1 installer.
  # Extract only; never execute the installer. Keep DLL hashes in lockstep with
  # src-tauri/src/player/angle_loader.rs. The vendor tag survives release cleanup.
  ANGLE_ARCHIVE_URL: https://github.com/nwilliams22/prexu/releases/download/libmpv-vendor/Prexu_0.7.1_x64-setup.exe
  ANGLE_ARCHIVE_SHA256: 6872d887ac3c7010617f7d743173c7d0438ceb7c85a584d0c0bd805d1c905087
  ANGLE_EGL_SHA256: a86422d6d679dda4c00bb0db813884eb14857924eb391fb48283dfca5be007ef
  ANGLE_GLESV2_SHA256: b48565279ebfcc75675e9b88a1835bd9fd94016290641bc98108ae382962b2f3

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Test release version guard
        run: node --test scripts/check-release-version.test.mjs
      - name: Verify tag matches application versions
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/check-release-version.mjs --tag "$RELEASE_TAG"

  build:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        # Windows + Linux release targets; macOS distribution remains deferred.
        # Ubuntu 24.04 sets a glibc 2.39 compatibility floor. Linux uses
        # pinned LGPL-mode shared libraries, not the distro GPL mpv build.
        include: ${{ fromJSON((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) && '[{"os":"windows-latest","target":"x86_64-pc-windows-msvc"},{"os":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu"}]' || '[{"os":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu"}]') }}

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            rpm xvfb xauth mesa-utils dbus \
            meson ninja-build nasm pkg-config \
            libass-dev libplacebo-dev libpulse-dev libasound2-dev \
            libegl1-mesa-dev libgl1-mesa-dev libdrm-dev libva-dev \
            zlib1g-dev
          # Never install distro libmpv here: API 1.x cannot initialize, and
          # an API 2.x distro package alone does not establish LGPL provenance.

      - name: Build pinned LGPL shared media libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euxo pipefail
          MEDIA_PREFIX="$RUNNER_TEMP/prexu-media"
          mkdir -p "$MEDIA_PREFIX" "$RUNNER_TEMP/media-sources"
          cd "$RUNNER_TEMP/media-sources"
          curl --fail --location --retry 3 https://ffmpeg.org/releases/ffmpeg-7.1.5.tar.xz -o ffmpeg.tar.xz
          curl --fail --location --retry 3 https://codeload.github.com/mpv-player/mpv/tar.gz/refs/tags/v0.39.0 -o mpv.tar.gz
          echo 'de668509caf9e35e3cd162473441fdb29538c6d96ed080292b3cf9e6fc5d558f  ffmpeg.tar.xz' | sha256sum -c -
          echo '2ca92437affb62c2b559b4419ea4785c70d023590500e8a52e95ea3ab4554683  mpv.tar.gz' | sha256sum -c -
          tar -xf ffmpeg.tar.xz
          tar -xf mpv.tar.gz
          export PKG_CONFIG_PATH="$MEDIA_PREFIX/lib/pkgconfig"
          export LD_LIBRARY_PATH="$MEDIA_PREFIX/lib"
          cd ffmpeg-7.1.5
          ./configure --prefix="$MEDIA_PREFIX" --libdir="$MEDIA_PREFIX/lib" \
            --enable-shared --disable-static --disable-gpl --disable-nonfree \
            --disable-version3 --disable-autodetect --disable-programs --disable-doc \
            --enable-openssl --enable-zlib --enable-vaapi
          make -j"$(nproc)"
          make install
          cd ../mpv-0.39.0
          # Backport upstream 72d43dc: initialize scaler LUT padding (NaNs can render black).
          patch --batch --fuzz=0 -p1 < "$GITHUB_WORKSPACE/scripts/patches/mpv-scaler-lut-padding.patch"
          meson setup build --prefix="$MEDIA_PREFIX" --libdir=lib \
            --buildtype=release --wrap-mode=nofallback \
            -Dgpl=false -Dlibmpv=true -Dcplayer=false \
            -Dlibarchive=disabled -Dlibbluray=disabled -Ddvdnav=disabled \
            -Dcdda=disabled -Djavascript=disabled -Dlua=disabled
          meson compile -C build
          meson install -C build
          test -f "$MEDIA_PREFIX/lib/libmpv.so.2"
          readelf -d "$MEDIA_PREFIX/lib/libmpv.so.2" | grep SONAME
          # Keep exact source, configure output and license texts in the bundle.
          # The rpm uses distro libraries at runtime; it does not carry this set.
          mkdir -p "$GITHUB_WORKSPACE/src-tauri/media-provenance"
          cp -f ../ffmpeg.tar.xz ../mpv.tar.gz "$GITHUB_WORKSPACE/src-tauri/media-provenance/"
          cp -f "$GITHUB_WORKSPACE/scripts/patches/mpv-scaler-lut-padding.patch" "$GITHUB_WORKSPACE/src-tauri/media-provenance/"
          cp -f ../ffmpeg-7.1.5/ffbuild/config.log "$GITHUB_WORKSPACE/src-tauri/media-provenance/ffmpeg-config.log"
          cp -f build/meson-logs/meson-log.txt "$GITHUB_WORKSPACE/src-tauri/media-provenance/mpv-meson-log.txt"
          cp -f LICENSE.LGPL "$GITHUB_WORKSPACE/src-tauri/media-provenance/mpv-LICENSE.LGPL"
          cp -f ../ffmpeg-7.1.5/COPYING.LGPLv2.1 "$GITHUB_WORKSPACE/src-tauri/media-provenance/ffmpeg-COPYING.LGPLv2.1"
          cp -f "$GITHUB_WORKSPACE/docs/linux-bundles.md" "$GITHUB_WORKSPACE/src-tauri/media-provenance/BUILD.md"
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          config = {"bundle": {"linux": {"appimage": {"files": {
              "usr/share/doc/prexu/media": os.environ['GITHUB_WORKSPACE'] + '/src-tauri/media-provenance'
          }}}}}
          if not (os.environ['GITHUB_EVENT_NAME'] == 'push' and os.environ['GITHUB_REF'].startswith('refs/tags/')):
              config['bundle']['createUpdaterArtifacts'] = False
          Path(os.environ['GITHUB_WORKSPACE'], 'src-tauri/bundle-media.conf.json').write_text(json.dumps(config))
          PYCODE
          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$MEDIA_PREFIX/lib" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=-L native=$MEDIA_PREFIX/lib" >> "$GITHUB_ENV"

      # ── Windows: libmpv dev files ───────────────────────────────────────
      # The libmpv2 crate's `build_libmpv` feature on Windows expects a layout
      # of `MPV_SOURCE/64/{libmpv-2.dll, mpv.lib}`. shinchiro's archive ships
      # only the DLL + GNU import lib (libmpv.dll.a); we generate the MSVC-
      # format mpv.lib from the DLL exports using dumpbin + lib.
      - name: Cache libmpv (Windows)
        if: runner.os == 'Windows'
        id: cache-libmpv
        uses: actions/cache@v4
        with:
          path: C:\libmpv
          key: libmpv-${{ hashFiles('.github/workflows/release.yml') }}-${{ env.LIBMPV_URL }}-${{ env.LIBMPV_SHA256 }}

      - name: Setup MSVC dev environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install libmpv (Windows)
        if: runner.os == 'Windows' && steps.cache-libmpv.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path C:\libmpv\64 | Out-Null
          Write-Host "Downloading libmpv from $env:LIBMPV_URL"
          Invoke-WebRequest -Uri $env:LIBMPV_URL -OutFile mpv-dev.7z -UseBasicParsing
          $actual = (Get-FileHash mpv-dev.7z -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $env:LIBMPV_SHA256.ToLower()) {
            Write-Error "SHA256 mismatch: expected $env:LIBMPV_SHA256 got $actual"
            exit 1
          }
          Write-Host "SHA256 verified: $actual"
          Write-Host "Extracting to C:\libmpv\64"
          7z x mpv-dev.7z -oC:\libmpv\64 -y | Out-Null
          if (-not (Test-Path C:\libmpv\64\libmpv-2.dll)) {
              throw "libmpv-2.dll not found after extraction — archive layout may have changed"
          }
          Write-Host "Generating mpv.lib from libmpv-2.dll exports"
          Push-Location C:\libmpv\64
          # Parse dumpbin /EXPORTS output: lines with `<ord> <hint> <RVA> <name>`
          # are exports. Filter to mpv_* symbols and emit a .def file that lib.exe
          # can turn into an MSVC-format import library.
          $exports = & dumpbin /EXPORTS libmpv-2.dll
          $symbols = $exports `
              | ForEach-Object {
                  if ($_ -match '^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+(\S+)') {
                      $matches[1]
                  }
              } `
              | Where-Object { $_ -like 'mpv_*' }
          if ($symbols.Count -eq 0) {
              throw "No mpv_* exports found in libmpv-2.dll — dumpbin output format may have changed"
          }
          Write-Host "Found $($symbols.Count) mpv_* exports"
          $defLines = @("LIBRARY libmpv-2", "EXPORTS") + $symbols
          Set-Content -Path mpv.def -Value $defLines -Encoding ASCII
          & lib /def:mpv.def /out:mpv.lib /machine:x64
          if (-not (Test-Path mpv.lib)) {
              throw "lib.exe failed to produce mpv.lib"
          }
          Pop-Location
          Write-Host "libmpv install complete"

      - name: Export MPV_SOURCE (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_ENV -Value "MPV_SOURCE=C:\libmpv"
          Add-Content -Path $env:GITHUB_PATH -Value "C:\libmpv\64"

      # ── Windows: ANGLE runtime DLLs ─────────────────────────────────────
      # The native player's DirectComposition render path loads libEGL.dll +
      # libGLESv2.dll at runtime, SHA-256-pinned + Authenticode-verified
      # (src/player/angle_loader.rs). bin/ is gitignored, so fetch the pinned
      # DLLs into src-tauri/bin/ where tauri.windows.conf.json bundles them and
      # build.rs copies them next to the dev exe. SHA256 is verified against the
      # angle_loader pins — a mismatch fails the build (the player would reject
      # the DLLs anyway).
      - name: Install ANGLE DLLs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bin = Join-Path $env:GITHUB_WORKSPACE "src-tauri\bin"
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          $archive = Join-Path $env:RUNNER_TEMP "prexu-angle-source.exe"
          Invoke-WebRequest -Uri $env:ANGLE_ARCHIVE_URL -OutFile $archive
          $archiveHash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          if ($archiveHash -ne $env:ANGLE_ARCHIVE_SHA256) {
            throw "ANGLE source archive SHA256 mismatch: $archiveHash"
          }
          & 7z e -y $archive "libEGL.dll" "libGLESv2.dll" "-o$bin"
          if ($LASTEXITCODE -ne 0) { throw "ANGLE extraction failed: $LASTEXITCODE" }
          $dlls = @(
            @{ Name = "libEGL.dll"; Sha = $env:ANGLE_EGL_SHA256 },
            @{ Name = "libGLESv2.dll"; Sha = $env:ANGLE_GLESV2_SHA256 }
          )
          foreach ($d in $dlls) {
            $dest = Join-Path $bin $d.Name
            $actual = (Get-FileHash $dest -Algorithm SHA256).Hash.ToLower()
            if ($actual -ne $d.Sha) {
              throw "SHA256 mismatch for $($d.Name): expected $($d.Sha) got $actual"
            }
            $signature = Get-AuthenticodeSignature $dest
            if ($signature.Status -ne 'Valid') {
              throw "Invalid Authenticode signature for $($d.Name): $($signature.Status)"
            }
            Write-Host "Verified $($d.Name): SHA256 $actual; signer $($signature.SignerCertificate.Subject)"
          }

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Linux candidate (no release)
        if: ${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) }}
        run: npm run tauri build -- --target ${{ matrix.target }} --config src-tauri/bundle-media.conf.json

      - name: Build Tauri app
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Prexu ${{ github.ref_name }}"
          # Both matrix jobs write the same body, so the text must stay accurate
          # for every asset in the release, Windows and Linux alike.
          releaseBody: |
            **Windows** — the NSIS `.exe` and the MSI are the supported download.

            **Linux — experimental.** The AppImage targets glibc 2.39 or newer
            and bundles LGPL-mode libmpv API 2.x and FFmpeg shared libraries,
            with their exact source archives and build records. The rpm requires
            distro libmpv.so.2, OpenSSL 3 and the GTK/WebKit runtime libraries.
            See [Linux bundle acceptance](https://github.com/nwilliams22/prexu/blob/main/docs/linux-bundles.md)
            for artifact checks and remaining hardware acceptance. macOS is not distributed.

            GPU, audio and window/DPI/fullscreen acceptance on Windows was
            **waived, not performed** — hosted runners have no graphics card and no
            audio device. Read **Known untested on Windows** in the
            [changelog](https://github.com/nwilliams22/prexu/blob/main/CHANGELOG.md)
            before deploying.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }} ${{ runner.os == 'Linux' && '--config src-tauri/bundle-media.conf.json' || '' }}

      - name: Inspect Linux artifacts
        if: runner.os == 'Linux'
        run: |
          set -euxo pipefail
          bundle="$GITHUB_WORKSPACE/src-tauri/target/${{ matrix.target }}/release/bundle"
          appimage=$(find "$bundle/appimage" -maxdepth 1 -name '*.AppImage' -print -quit)
          package=$(find "$bundle/rpm" -maxdepth 1 -name '*.rpm' -print -quit)
          mkdir -p "$RUNNER_TEMP/bundle-check"
          cd "$RUNNER_TEMP/bundle-check"
          "$appimage" --appimage-extract > extraction.log
          readelf -d squashfs-root/usr/bin/prexu | tee needed.log
          grep -F 'Shared library: [libmpv.so.2]' needed.log
          test -f squashfs-root/usr/lib/libmpv.so.2
          test -z "$(find squashfs-root -name 'libmpv.so.1*' -print -quit)"
          find squashfs-root -name 'libmpv*' | tee bundled-mpv.log
          rpm -qp --requires "$package" | tee rpm-requires.log
          # Every direct ELF dependency needs an rpm provider, including the
          # non-media libraries linuxdeploy includes only in the AppImage.
          while read -r soname; do
            grep -Fx "$soname()(64bit)" rpm-requires.log
          done < <(sed -n 's/.*Shared library: \[\(.*\)\].*/\1/p' needed.log)
          # Inspect the bundled media libraries, never the build-host copy.
          env -u LD_LIBRARY_PATH python3 - <<'PYCODE' | tee media-runtime.log
          import ctypes, os
          from pathlib import Path
          root = Path('squashfs-root/usr/lib').resolve()
          for name in ['avutil', 'swresample', 'swscale', 'avcodec', 'avformat', 'avfilter']:
              path = next(root.glob(f'lib{name}.so.*'))
              lib = ctypes.CDLL(str(path), mode=os.RTLD_GLOBAL)
              license_fn = getattr(lib, f'{name}_license')
              license_fn.restype = ctypes.c_char_p
              license_text = license_fn().decode()
              print(f'{path.name}: {license_text}', flush=True)
              assert 'LGPL' in license_text
          mpv = ctypes.CDLL(str(root / 'libmpv.so.2'))
          mpv.mpv_client_api_version.restype = ctypes.c_ulong
          api = mpv.mpv_client_api_version()
          print(f'Bundled mpv client API: {api >> 16}.{api & 65535}', flush=True)
          assert api >> 16 == 2
          mpv.mpv_create.restype = ctypes.c_void_p
          handle = mpv.mpv_create()
          assert handle
          print('Bundled mpv handle created', flush=True)
          mpv.mpv_terminate_destroy.argtypes = [ctypes.c_void_p]
          mpv.mpv_terminate_destroy(handle)
          PYCODE

      - name: Launch Linux AppImage under Xvfb
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/bundle-check"
          # Use AppRun to exercise the shipped library search path. Do not
          # disable DMABUF: the native compositor needs WebKit's renderer.
          set +e
          env -u LD_LIBRARY_PATH -u WEBKIT_DISABLE_DMABUF_RENDERER \
            -u PREXU_STOCK_WEBVIEW -u PREXU_NO_COMPOSITOR \
            LIBGL_ALWAYS_SOFTWARE=1 RUST_LOG=info \
            dbus-run-session -- timeout 30s xvfb-run -a ./squashfs-root/AppRun > native-startup.log 2>&1
          result=$?
          set -e
          cat native-startup.log
          printf 'AppImage launch exit status: %s (expected 124)\n' "$result"
          test "$result" -eq 124
          grep -F '[player] mpv created' native-startup.log
          grep -F '[player:linux] compositor installed' native-startup.log
          ! grep -Ei 'VersionMismatch|falling back|fallback to HTML5' native-startup.log

      - name: Upload Linux candidates and evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundles-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            ${{ runner.temp }}/bundle-check/*.log
            src-tauri/media-provenance/

  cleanup:
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Delete old releases (keep last 3)
        uses: dev-drprasad/delete-older-releases@v0.3.4
        with:
          keep_latest: 3
          delete_tags: true
          # Strict semver vN.N.N only — must NOT match the libmpv-vendor archive tag
          delete_tag_pattern: '^v\d+\.\d+\.\d+$'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
