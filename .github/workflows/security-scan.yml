name: Security scan

# Scan every main push and PR so this can be a required check without path-filter
# skips. The schedule also catches advisories published while dependencies stand
# still; push/PR runs do not depend on the scheduled workflow remaining enabled.
# Require the `scan` check in the main branch protection/ruleset (owner setting).

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install syft + grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b "$HOME/.local/bin"
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache grype DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/grype/db
          key: grype-db-${{ github.run_id }}
          restore-keys: grype-db-

      - name: Generate SBOMs
        run: |
          mkdir -p .sbom
          syft package-lock.json         -o syft-json=.sbom/npm.json   -q
          syft src-tauri/Cargo.lock       -o syft-json=.sbom/tauri.json -q
          syft relay-server/Cargo.lock    -o syft-json=.sbom/relay.json -q

      - name: Scan (fail on High/Critical)
        run: |
          status=0
          for eco in npm tauri relay; do
            echo "::group::grype $eco"
            grype "sbom:.sbom/$eco.json" -o table --fail-on high || status=1
            echo "::endgroup::"
          done
          exit $status
