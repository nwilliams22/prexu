name: Security scan

# Scan every main push and PR so this can be a required check without path-filter
# skips. The schedule also catches advisories published while dependencies stand
# still; push/PR runs do not depend on the scheduled workflow remaining enabled.
# Require the `scan` check in the main branch protection/ruleset (owner setting).

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache scanner binaries
        id: scanner-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/prexu-tools/scanners
          key: scanners-${{ runner.os }}-${{ runner.arch }}-syft-1.57.0-grype-0.121.2-v1

      - name: Install syft + grype
        if: steps.scanner-cache.outputs.cache-hit != 'true'
        run: |
          # Direct, versioned assets avoid runtime release discovery and mutable
          # installer scripts. Retry transient failures; never skip a failed install.
          install_tool() (
            set -euo pipefail
            tool="$1"
            version="$2"
            archive="${tool}_${version}_linux_amd64.tar.gz"
            checksums="${tool}_${version}_checksums.txt"
            base="https://github.com/anchore/${tool}/releases/download/v${version}"
            workdir=$(mktemp -d)
            trap 'rm -rf "$workdir"' EXIT
            cd "$workdir"
            for asset in "$archive" "$checksums"; do
              curl --fail --silent --show-error --location \
                --retry 5 --retry-all-errors --connect-timeout 20 --max-time 120 \
                "$base/$asset" --output "$asset"
            done
            awk -v asset="$archive" '$2 == asset {print}' "$checksums" > selected.sha256
            test "$(wc -l < selected.sha256)" -eq 1
            sha256sum --check selected.sha256
            tar -xzf "$archive" "$tool"
            install -Dm755 "$tool" "$HOME/.cache/prexu-tools/scanners/$tool"
            "$HOME/.cache/prexu-tools/scanners/$tool" version
          )
          install_tool syft 1.57.0
          install_tool grype 0.121.2

      - name: Set up scanners
        run: |
          "$HOME/.cache/prexu-tools/scanners/syft" version
          "$HOME/.cache/prexu-tools/scanners/grype" version
          echo "$HOME/.cache/prexu-tools/scanners" >> "$GITHUB_PATH"

      - name: Cache grype DB
        uses: actions/cache@v6
        with:
          path: ~/.cache/grype/db
          key: grype-db-${{ github.run_id }}
          restore-keys: grype-db-

      - name: Generate SBOMs
        run: |
          mkdir -p .sbom
          syft package-lock.json         -o syft-json=.sbom/npm.json   -q
          syft src-tauri/Cargo.lock       -o syft-json=.sbom/tauri.json -q
          syft relay-server/Cargo.lock    -o syft-json=.sbom/relay.json -q

      - name: Scan (fail on High/Critical)
        run: |
          status=0
          for eco in npm tauri relay; do
            echo "::group::grype $eco"
            grype "sbom:.sbom/$eco.json" -o table --fail-on high || status=1
            echo "::endgroup::"
          done
          exit $status
