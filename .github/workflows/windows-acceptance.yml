name: Windows acceptance

# Disposable installer acceptance only; never publishes a release.
on:
  workflow_dispatch:
    inputs:
      candidate_run:
        description: Successful Windows candidate run containing both installers
        required: false
      release_tag:
        description: Published release tag (exactly one of release_tag or candidate_run)
        required: false
      fault:
        description: Negative control (must make acceptance fail)
        type: choice
        options: [none, missing-dll]
        default: none

permissions:
  contents: read
  actions: read

jobs:
  acceptance:
    name: Accept ${{ matrix.format }} (${{ inputs.fault }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        format: [nsis, msi]
    steps:
      - name: Validate source selection
        shell: pwsh
        env:
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if ([bool]$env:CANDIDATE_RUN -eq [bool]$env:RELEASE_TAG) {
            throw 'Specify exactly one of candidate_run or release_tag'
          }
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Download successful candidate
        if: inputs.candidate_run != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
        run: |
          if ($env:CANDIDATE_RUN -notmatch '^\d+$') { throw 'Invalid run ID' }
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:CANDIDATE_RUN" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read candidate run' }
          if ($run.conclusion -ne 'success' -or $run.path -ne '.github/workflows/windows-candidate.yml') {
            throw 'Input must be a successful Windows candidate run'
          }
          $artifacts = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:CANDIDATE_RUN/artifacts" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read artifacts' }
          $match = @($artifacts.artifacts | Where-Object { $_.name -eq "windows-candidate-$($run.head_sha)-$($run.run_attempt)" -and -not $_.expired })
          if ($match.Count -ne 1) { throw 'Expected exactly one unexpired candidate artifact' }
          gh run download $env:CANDIDATE_RUN --repo $env:GITHUB_REPOSITORY --name $match[0].name --dir candidate
          if ($LASTEXITCODE -ne 0) { throw 'Artifact download failed' }
          if (-not (Select-String -Path candidate/BUILD.txt -SimpleMatch "Commit: $($run.head_sha)" -Quiet)) {
            throw 'Candidate provenance does not match run'
          }
          Write-Host "Candidate source $($run.head_sha), run $env:CANDIDATE_RUN, artifact $($match[0].name)"
      - name: Test release provenance validation
        run: node --test scripts/windows-acceptance/release.test.mjs
      - name: Download verified published release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/windows-acceptance/release.mjs
      - name: Accept install, readiness, upgrade and uninstall
        shell: pwsh
        env:
          INSTALLER_FORMAT: ${{ matrix.format }}
          ACCEPTANCE_FAULT: ${{ inputs.fault }}
        run: ./scripts/windows-acceptance/accept.ps1 -Format $env:INSTALLER_FORMAT -Fault $env:ACCEPTANCE_FAULT
      - name: Upload acceptance diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-acceptance-${{ matrix.format }}-${{ inputs.fault }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: acceptance-logs/
          if-no-files-found: warn
          retention-days: 14
