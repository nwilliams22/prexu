name: macOS candidate

# Testing only; produces an artifact without creating a tag or release.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: macos-15
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install targets for the repository toolchain
        # rust-toolchain.toml can select a different version from stable.
        run: rustup target add aarch64-apple-darwin

      - name: Install native build prerequisites
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          brew install mpv pkg-config
          # Keg-only dependencies (notably libarchive) are not in the default
          # pkg-config search path even though Homebrew installed them.
          export PKG_CONFIG_PATH="$(brew --prefix mpv)/lib/pkgconfig"
          for formula in $(brew deps mpv); do
            prefix="$(brew --prefix "$formula")"
            PKG_CONFIG_PATH="$PKG_CONFIG_PATH:$prefix/lib/pkgconfig:$prefix/share/pkgconfig"
          done
          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH" >> "$GITHUB_ENV"
          pkg-config --print-errors --modversion mpv
          pkg-config --print-errors --atleast-version=2.5.0 mpv
          mkdir -p candidate
          brew list --versions mpv $(brew deps mpv) > candidate/homebrew-versions.txt
          brew info --json=v2 --installed > candidate/homebrew-installed.json
          otool -D "$(brew --prefix mpv)/lib/libmpv.dylib" | tail -n 1 > candidate/libmpv-install-name.txt
          otool -L "$(brew --prefix mpv)/lib/libmpv.dylib" > candidate/libmpv-dependencies.txt
          pkg-config --modversion mpv > candidate/libmpv-api-version.txt

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify playback gate
        run: npx vitest run src/services/plex-playback.test.ts src/services/plex-playback-prepare-source.test.ts

      - name: Build Apple Silicon test installer
        run: |
          # Ad-hoc signing needs no certificate or production signing secrets.
          # Updater artifacts are disabled for this non-release candidate.
          cat > candidate.conf.json <<'JSON'
          {"bundle":{"createUpdaterArtifacts":false,"macOS":{"signingIdentity":"-"}}}
          JSON
          npm run tauri -- build --ci --target aarch64-apple-darwin --bundles app,dmg --config "$PWD/candidate.conf.json"

      - name: Inspect installer and collect provenance
        run: |
          set -euo pipefail
          bundle=src-tauri/target/aarch64-apple-darwin/release/bundle
          app="$bundle/macos/Prexu.app"
          binary="$app/Contents/MacOS/prexu"
          mkdir -p candidate
          test "$(lipo -archs "$binary")" = arm64
          codesign --verify --deep --strict --verbose=2 "$app"
          otool -L "$binary" | tee candidate/dependencies.txt
          otool -l "$binary" > candidate/load-commands.txt
          codesign -dvv "$app" 2> candidate/signature.txt
          python3 - <<'PYTHON'
          from pathlib import Path
          import re
          expected = Path("candidate/libmpv-install-name.txt").read_text().strip()
          commands = Path("candidate/load-commands.txt").read_text()
          found = False
          for block in commands.split("Load command ")[1:]:
              cmd = re.search(r"cmd (LC_\w+)", block)
              name = re.search(r"name (.+) \(offset", block)
              if not cmd or not name or "DYLIB" not in cmd[1]:
                  continue
              dependency = name[1]
              if dependency == expected:
                  assert cmd[1] == "LC_LOAD_WEAK_DYLIB", block
                  found = True
              else:
                  assert dependency.startswith(("/System/Library/", "/usr/lib/")), block
          assert found, "Expected optional libmpv weak load command missing"
          PYTHON
          for dmg in "$bundle"/dmg/*.dmg; do
            hdiutil verify "$dmg"
            cp -f "$dmg" candidate/
          done
          cp -f docs/macos-candidate.md candidate/README.md
          {
            echo 'Testing only; not a release or playback acceptance.'
            echo "Commit: $GITHUB_SHA"
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Attempt: $GITHUB_RUN_ATTEMPT"
            echo 'Architecture: arm64 (Apple Silicon only; not universal)'
            echo 'libmpv is an optional external Homebrew dependency, not bundled.'
            echo 'HTML5 launch requires no Homebrew; native playback requires brew install mpv.'
            echo 'Ad-hoc signed; not Apple Developer ID signed or notarized.'
            echo 'Updater artifacts disabled; no production signing keys used.'
            sw_vers
            rustc --version
            node --version
          } > candidate/BUILD.txt
          (cd candidate && shasum -a 256 ./*.dmg > SHA256SUMS.txt)

      - name: Upload test installer
        uses: actions/upload-artifact@v4
        with:
          name: macos-candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: candidate/
          if-no-files-found: error
          retention-days: 30
