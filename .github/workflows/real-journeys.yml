name: Real journey credential gates
on:
  push:
    branches: [main]
    paths: ['scripts/real-journeys/**', '.github/workflows/real-journeys.yml']
  pull_request:
    paths: ['scripts/real-journeys/**', '.github/workflows/real-journeys.yml']
permissions:
  contents: read
jobs:
  credential-gates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node --check scripts/real-journeys/run.mjs
      - run: node --check scripts/real-journeys/native.mjs
      - run: node --check scripts/real-journeys/native-driver.js
      - run: node --test scripts/real-journeys/*.test.mjs
